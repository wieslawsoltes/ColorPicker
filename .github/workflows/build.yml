name: Build

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - master
      - main
      - develop

permissions:
  contents: read
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PUBLISH_FRAMEWORK: net10.0
  PUBLISH_PROJECT: samples/ColorPickerDemo/ColorPickerDemo.csproj

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=build.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore ThemeEditor.sln

      - name: Build
        run: dotnet build ThemeEditor.sln -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=build.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore ThemeEditor.sln

      - name: Build
        run: dotnet build ThemeEditor.sln -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

      - name: Test
        run: dotnet test ThemeEditor.sln -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Test Results (${{ matrix.os }})
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  pack:
    name: Pack (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=build.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore ThemeEditor.sln

      - name: Build
        run: dotnet build ThemeEditor.sln -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

      - name: Pack
        run: dotnet pack src/ThemeEditor.Controls.ColorPicker/ThemeEditor.Controls.ColorPicker.csproj -c Release --no-build -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -o artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-ubuntu-latest
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish-sample:
    name: Publish Sample (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [build, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rid: win-x64
          - name: ubuntu
            os: ubuntu-latest
            rid: linux-x64
          - name: debian
            os: ubuntu-latest
            rid: linux-x64
          - name: macos
            os: macos-latest
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=build.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore ThemeEditor.sln

      - name: Build
        run: dotnet build ThemeEditor.sln -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

      - name: Publish sample app
        run: dotnet publish "${{ env.PUBLISH_PROJECT }}" -c Release -f "${{ env.PUBLISH_FRAMEWORK }}" -r "${{ matrix.rid }}" --self-contained true -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -o "artifacts/publish/${{ matrix.name }}"

      - name: Archive published app
        shell: pwsh
        run: |
          Get-ChildItem -Path "artifacts/publish/${{ matrix.name }}" -Force | Compress-Archive -DestinationPath "artifacts/publish/ColorPickerDemo-${{ matrix.name }}.zip" -Force

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-${{ matrix.name }}
          path: artifacts/publish/ColorPickerDemo-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 30
