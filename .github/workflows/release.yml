name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 12.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PUBLISH_FRAMEWORK: net10.0
  PUBLISH_PROJECT: samples/ColorPickerDemo/ColorPickerDemo.csproj

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag-name: ${{ steps.version.outputs.tag-name }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            if [[ "$VERSION" == *"-"* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag-name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ThemeEditor.sln

      - name: Build
        run: dotnet build ThemeEditor.sln -c Release --no-restore -p:Version="${{ steps.version.outputs.version }}"

  test:
    name: Test Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ThemeEditor.sln

      - name: Build
        run: dotnet build ThemeEditor.sln -c Release --no-restore -p:Version="${{ needs.build.outputs.version }}"

      - name: Test
        run: dotnet test ThemeEditor.sln -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Release Test Results
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  pack:
    name: Pack Release
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ThemeEditor.sln

      - name: Build
        run: dotnet build ThemeEditor.sln -c Release --no-restore -p:Version="${{ needs.build.outputs.version }}"

      - name: Pack
        run: dotnet pack src/ThemeEditor.Controls.ColorPicker/ThemeEditor.Controls.ColorPicker.csproj -c Release --no-build -p:Version="${{ needs.build.outputs.version }}" -o artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  publish-sample:
    name: Publish Release Sample (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [build, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rid: win-x64
          - name: ubuntu
            os: ubuntu-latest
            rid: linux-x64
          - name: debian
            os: ubuntu-latest
            rid: linux-x64
          - name: macos
            os: macos-latest
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ThemeEditor.sln

      - name: Build
        run: dotnet build ThemeEditor.sln -c Release --no-restore -p:Version="${{ needs.build.outputs.version }}"

      - name: Publish sample app
        run: dotnet publish "${{ env.PUBLISH_PROJECT }}" -c Release -f "${{ env.PUBLISH_FRAMEWORK }}" -r "${{ matrix.rid }}" --self-contained true -p:Version="${{ needs.build.outputs.version }}" -o "artifacts/publish/${{ matrix.name }}"

      - name: Archive published app
        shell: pwsh
        run: |
          Get-ChildItem -Path "artifacts/publish/${{ matrix.name }}" -Force | Compress-Archive -DestinationPath "artifacts/publish/ColorPickerDemo-${{ matrix.name }}.zip" -Force

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: release-sample-${{ matrix.name }}
          path: artifacts/publish/ColorPickerDemo-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 90

  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build, pack]
    environment: nuget
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-packages
          path: release-assets/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish to NuGet
        shell: bash
        run: |
          shopt -s nullglob
          for package in release-assets/packages/*.nupkg release-assets/packages/*.snupkg; do
            echo "Publishing $package..."
            dotnet nuget push "$package" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, pack, publish-sample, publish-nuget]
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-packages
          path: release-assets/packages

      - name: Download published sample apps
        uses: actions/download-artifact@v4
        with:
          pattern: release-sample-*
          path: release-assets/publish
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ColorPicker v${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.tag-name }}
          draft: false
          prerelease: ${{ needs.build.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/packages/*.nupkg
            release-assets/packages/*.snupkg
            release-assets/publish/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
